x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  waha:
    # Версия зафиксирована, чтобы образ не обновлялся сам и не ломал работу
    image: devlikeapro/waha@sha256:41283bd89922ec3f722e5a772b844c451634d4aa72e9c34043c3480184f970fe  # 2026.9.1
    container_name: waha_service
    restart: always
    env_file:
      - .env
    expose:
      - "3000"
    environment:
      - WAHA_DOMAIN=waha.rehubpro.kz
      - VIRTUAL_HOST=waha.rehubpro.kz
      - LETSENCRYPT_HOST=waha.rehubpro.kz
      - LETSENCRYPT_EMAIL=admin@rehubpro.kz
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
      - WAHA_PRINT_QR=true
      - WHATSAPP_API_KEY_EXCLUDE_PATH=ping,health
      - TZ=Asia/Almaty
    volumes:
      - ./waha_sessions:/app/.sessions
    networks:
      - core_backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-m", "10", "http://localhost:3000/ping"]
      interval: 30s
      timeout: 15s
      retries: 4
      start_period: 60s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  whatsapp-gateway:
    build: ./gateway
    container_name: whatsapp_gateway
    restart: always
    env_file:
      - .env
    expose:
      - "8000"
    environment:
      - VIRTUAL_HOST=wh-gateway.rehubpro.kz
      - LETSENCRYPT_HOST=wh-gateway.rehubpro.kz
      - LETSENCRYPT_EMAIL=admin@rehubpro.kz
      - TZ=Asia/Almaty
    volumes:
      - ./gateway/data:/app/data
    networks:
      core_backend:
        aliases:
          - wh-gateway.internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

networks:
  core_backend:
    external: true
